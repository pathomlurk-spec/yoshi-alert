name: BTC Alert

on:
  schedule:
    - cron: '0 0 * * *'  # รันทุกวันตอนเที่ยงคืน UTC (07:00 น. เวลาไทย)
  workflow_dispatch:       # กดรันมือได้จาก GitHub

jobs:
  check-signal:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run BTC Alert
        run: python btc_alert.py
